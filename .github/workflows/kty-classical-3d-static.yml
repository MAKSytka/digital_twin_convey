name: KTY classical 3-D static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "src/singulator_interfaces/**"
      - "scripts/*kty_perception_3d.sh"
      - "tools/validate_kty_classical_3d.py"
      - "docs/KTY_CLASSICAL_3D_STAGE6.md"
      - ".github/workflows/kty-classical-3d-static.yml"
  push:
    branches:
      - "feat/kty-classical-3d-perception-v6"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate classical 3-D perception wiring
        run: python3 tools/validate_kty_classical_3d.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_perception_3d.sh
          bash -n scripts/run_kty_perception_3d.sh
          bash -n scripts/check_kty_perception_3d.sh
