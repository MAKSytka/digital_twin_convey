name: KTY flow static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "scripts/*kty_flow.sh"
      - "tools/validate_kty_flow.py"
      - "docs/KTY_FLOW_STAGE2.md"
      - ".github/workflows/kty-flow-static.yml"
  push:
    branches:
      - "feat/kty-flow-cycle-v2"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate KTY flow world and wiring
        run: python3 tools/validate_kty_flow.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_flow.sh
          bash -n scripts/run_kty_flow.sh
          bash -n scripts/check_kty_flow.sh
          bash -n scripts/stop_kty_flow.sh
