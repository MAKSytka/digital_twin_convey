name: KTY vision static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "src/singulator_interfaces/msg/KtyProductContour*.msg"
      - "src/singulator_interfaces/CMakeLists.txt"
      - "scripts/*kty_vision.sh"
      - "tools/validate_kty_vision.py"
      - ".github/workflows/kty-vision-static.yml"
  push:
    branches:
      - "feat/kty-vision-dashboard-v4"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate RGB-D world and perception wiring
        run: python3 tools/validate_kty_vision.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_vision.sh
          bash -n scripts/run_kty_vision.sh
          bash -n scripts/check_kty_vision.sh
          bash -n scripts/stop_kty_vision.sh
