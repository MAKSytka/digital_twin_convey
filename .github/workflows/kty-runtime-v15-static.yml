name: KTY runtime v15 static validation

on:
  pull_request:
    paths:
      - "src/kty_conveyor_surface/**"
      - "src/kty_station_sim/**"
      - "scripts/build_kty_perception_3d.sh"
      - "scripts/run_kty_perception_3d.sh"
      - "tools/validate_kty_runtime_v15.py"
      - ".github/workflows/kty-runtime-v15-static.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime v15 wiring
        run: python3 tools/validate_kty_runtime_v15.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_perception_3d.sh
          bash -n scripts/run_kty_perception_3d.sh
