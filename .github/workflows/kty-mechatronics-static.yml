name: KTY mechatronics static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "scripts/*kty_mechatronics.sh"
      - "tools/validate_kty_mechatronics.py"
      - "docs/KTY_MECHATRONICS_STAGE4.md"
      - ".github/workflows/kty-mechatronics-static.yml"
  push:
    branches:
      - "feat/kty-physical-mechatronics-v5"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate physical KTY world and wiring
        run: python3 tools/validate_kty_mechatronics.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_mechatronics.sh
          bash -n scripts/run_kty_mechatronics.sh
          bash -n scripts/check_kty_mechatronics.sh
          bash -n scripts/stop_kty_mechatronics.sh
