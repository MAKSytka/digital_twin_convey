name: KTY static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "src/singulator_interfaces/**"
      - "scripts/*kty_station.sh"
      - "scripts/build.sh"
      - "scripts/setup_dependencies.sh"
      - "tools/validate_kty_station.py"
      - ".github/workflows/kty-static.yml"
  push:
    branches:
      - "fix/kty-runtime-v2"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate KTY cross-file wiring
        run: python3 tools/validate_kty_station.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build.sh
          bash -n scripts/build_kty_station.sh
          bash -n scripts/run_kty_station.sh
          bash -n scripts/check_kty_station.sh
          bash -n scripts/setup_dependencies.sh
