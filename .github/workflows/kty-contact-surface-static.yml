name: KTY contact-surface static validation

on:
  pull_request:
    paths:
      - "src/kty_conveyor_surface/**"
      - "src/kty_station_sim/**"
      - "scripts/**kty**"
      - "tools/validate_kty_contact_surface.py"
      - ".github/workflows/kty-contact-surface-static.yml"
  push:
    branches:
      - "fix/kty-mechatronics-runtime-v7"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate roller-free world and wiring
        run: python3 tools/validate_kty_contact_surface.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_perception_3d.sh
          bash -n scripts/run_kty_perception_3d.sh
          bash -n scripts/run_kty_mechatronics.sh
