name: KTY runtime v16 static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "scripts/build_kty_perception_3d.sh"
      - "scripts/run_kty_perception_3d.sh"
      - "scripts/check_kty_runtime_v16.sh"
      - "tools/validate_kty_runtime_v16.py"
      - ".github/workflows/kty-runtime-v16-static.yml"
  push:
    branches:
      - fix/kty-mechatronics-runtime-v7
    paths:
      - "src/kty_station_sim/**"
      - "scripts/build_kty_perception_3d.sh"
      - "scripts/run_kty_perception_3d.sh"
      - "scripts/check_kty_runtime_v16.sh"
      - "tools/validate_kty_runtime_v16.py"
      - ".github/workflows/kty-runtime-v16-static.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime v16 wiring
        run: python3 tools/validate_kty_runtime_v16.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_perception_3d.sh
          bash -n scripts/run_kty_perception_3d.sh
          bash -n scripts/check_kty_runtime_v16.sh
