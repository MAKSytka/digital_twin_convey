name: KTY smoke static validation

on:
  pull_request:
    paths:
      - "src/kty_station_sim/**"
      - "scripts/*kty_smoke.sh"
      - "tools/validate_kty_smoke.py"
      - ".github/workflows/kty-smoke-static.yml"
  push:
    branches:
      - "feat/kty-smoke-baseline-v1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate smoke world and wiring
        run: python3 tools/validate_kty_smoke.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/build_kty_smoke.sh
          bash -n scripts/run_kty_smoke.sh
          bash -n scripts/check_kty_smoke.sh
          bash -n scripts/stop_kty_smoke.sh
